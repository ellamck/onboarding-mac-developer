name: Markdown Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"

jobs:
  markdown-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
